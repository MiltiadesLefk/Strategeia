server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches backend/app/main.py's security_headers middleware — this
    # container is what actually renders HTML for the browser, so it's the
    # right place for the browser-facing equivalents. HSTS is deliberately
    # NOT set here: this server only ever speaks plain HTTP, to whatever
    # terminates TLS in front of it (Caddy in docker-compose.prod.yml, or
    # nothing at all for local/LAN use) — setting HSTS from a server that
    # doesn't itself do TLS would tell the browser to require HTTPS for
    # this origin without this server being able to serve it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Built files carry a content hash in their name (index-AbC123.js), so a
    # given URL never changes and can be cached for a year. A missing file here
    # is a real 404, NOT the SPA fallback: a tab opened before a redeploy asks
    # for old chunk names that no longer exist, and answering with index.html
    # would hand the browser HTML where it expects JavaScript. A clean 404 lets
    # the app show its "updated, reload" prompt instead.
    # (No `always` on Cache-Control: a 404 must not be cached for a year.)
    # add_header directives in a location replace the ones inherited from the
    # server block, so the security headers are repeated here.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The page that names the current hashed files must never be served stale,
    # or a redeploy would not reach people who already have the app open.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

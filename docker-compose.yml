services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_runtime:/app/runtime
    environment:
      # For a real VPS deploy, set this to your public frontend origin
      # (e.g. https://strategeia.example.com) so the browser isn't blocked by CORS.
      - CORS_ORIGINS=http://localhost:5173
      # Opt-in stop-gap auth — see InfraSettings.api_shared_secret in
      # backend/app/config.py. Blank (default) means every endpoint stays
      # open, same as before. Set this to a real secret before exposing
      # port 8000 beyond localhost, and set the frontend build's
      # VITE_API_SHARED_SECRET below to the SAME value, or the frontend
      # itself gets locked out with 401s.
      - API_SHARED_SECRET=
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # For a real VPS deploy, set this to your public backend URL
        # (baked in at build time — Vite env vars aren't runtime-configurable).
        VITE_API_BASE_URL: http://localhost:8000
        # Must equal the backend's API_SHARED_SECRET above (also baked in at
        # build time). Leave both blank for today's no-auth local/LAN use.
        VITE_API_SHARED_SECRET: ""
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_runtime:

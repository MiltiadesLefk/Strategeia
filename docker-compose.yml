services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_runtime:/app/runtime
    environment:
      # For a real deploy, set this to your public frontend origin (e.g.
      # https://strategeia.example.com) so the browser isn't blocked by CORS.
      - CORS_ORIGINS=http://localhost:5173
      # Every API route requires logging in (the dashboard's own login
      # screen) or a real X-API-Key by default now (see
      # backend/app/config.py) — ALLOW_UNAUTHENTICATED_API keeps this
      # compose file's zero-config local/LAN behavior exactly like before
      # that existed. Set this to false once this is reachable beyond
      # localhost — see README. AUTH_PASSWORD (for the login) and
      # API_SHARED_SECRET (for scripts/Swagger, not the browser) both
      # auto-generate and log themselves at startup if left unset here.
      # AUTH_USERNAME is deliberately NOT listed here at all (rather than
      # set to "="): unlike those two, an env var explicitly set to empty
      # overrides its field default ("admin") with an actual empty string
      # instead of falling back to it — leaving the key out entirely is
      # what lets the "admin" default apply. Set AUTH_USERNAME=your-choice
      # here to override it with a real value.
      - ALLOW_UNAUTHENTICATED_API=true
      - AUTH_PASSWORD=
      - API_SHARED_SECRET=
      # Auth for the Claude Code CLI baked into the backend image (the
      # `claude_code_cli` LLM provider). Generate one on a machine where
      # you're logged in with `claude setup-token`, then put
      # CLAUDE_CODE_OAUTH_TOKEN=... in a gitignored `.env` next to this
      # file — compose reads it for this substitution. Blank = the CLI is
      # present but unauthenticated, so narratives fall back to rule-based.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Beta: every screen (Company dropdown, Market Scan, dashboard, auto-scan)
      # sees only these symbols — see data_providers/universe.py. Remove the
      # line to scan the full bundled universe again.
      - STRATEGEIA_DEV_TICKERS=NVDA,AAPL
      # The contact SEC EDGAR sees on each insider-trade request (the SEC
      # asks every program that downloads from it to say who runs it). Set
      # it in the same gitignored `.env` as CLAUDE_CODE_OAUTH_TOKEN above,
      # as SEC_EDGAR_USER_AGENT="Name/1.0 (purpose; you@example.com)":
      # plain ASCII, no link — the SEC answers 403 to a user-agent with a
      # URL in it. Blank = the made-up placeholder, kept for now (plan.md
      # D13); set a separate address before the S&P 500 backtest run.
      - SEC_EDGAR_USER_AGENT=${SEC_EDGAR_USER_AGENT:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # For a real deploy, set this to your public backend URL (baked in
        # at build time — Vite env vars aren't runtime-configurable).
        VITE_API_BASE_URL: http://localhost:8000
        # Must equal the backend's API_SHARED_SECRET above (also baked in
        # at build time) once the backend actually requires one. Left
        # blank here to match ALLOW_UNAUTHENTICATED_API=true above.
        VITE_API_SHARED_SECRET: ""
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_runtime:
